# Activated alongside the base profile in production deployments (see docker-compose.yml,
# SPRING_PROFILES_ACTIVE=docker,prod). Hardens defaults that are convenient for local dev
# but unsafe to expose in production.

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  # No fallback here: fail fast at startup if JWT_SECRET isn't set in production.
  secret: ${JWT_SECRET}
