server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: multi-tenant-backend
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/multi_tenant_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        multiTenancy: SCHEMA
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: true

  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours

app:
  documents:
    storage-path: ${APP_DOCUMENTS_STORAGE_PATH:/data/documents}
  signature:
    storage-path: ${APP_SIGNATURE_STORAGE_PATH:/data/signed-contracts}
  signnow:
    base-url: ${SIGNNOW_BASE_URL:https://api.signnow.com}
    basic-token: ${SIGNNOW_BASIC_TOKEN:}
    username: ${SIGNNOW_USERNAME:}
    password: ${SIGNNOW_PASSWORD:}
