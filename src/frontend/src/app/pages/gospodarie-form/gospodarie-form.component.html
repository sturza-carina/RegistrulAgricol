<ng-container *ngIf="isEmbedded">
  <div style="padding: 0;">
    <app-generic-form [config]="formConfig" [initialData]="formInitialData" [isSubmitting]="isSaving"
      (fieldChange)="onFieldValueChange($event)" (formSubmit)="save($event)" (formCancel)="cancel()">
    </app-generic-form>
  </div>
</ng-container>

<div class="app-shell" *ngIf="!isEmbedded && !isModal">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">Registru Agricol</div>
      <div class="topbar-spacer"></div>
    </header>

    <div class="page-content">
      <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>

      <div class="page-header-row" style="max-width: 800px; margin: 0 auto 20px;">
        <div style="display: flex; align-items: center; gap: 15px;">
          <button class="back-btn" (click)="cancel()"
            style="background:none; border:none; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:8px; border-radius:50%; transition:background 0.2s;"
            onmouseover="this.style.background='var(--body-bg)'" onmouseout="this.style.background='none'"
            title="Înapoi">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <h1
            style="font-size:24px;font-weight:700;font-family:'DM Serif Display',serif;color:var(--text-primary);margin:0;">
            {{ isEditMode ? 'Editare Gospodărie' : 'Adăugare Gospodărie' }}
          </h1>
        </div>
      </div>

      <div class="card gospodarie-form-card" style="padding: 30px; max-width: 800px; margin: 0 auto;">
        <div style="padding: 0; margin-top: -10px;">
          <app-generic-form [config]="formConfig" [initialData]="formInitialData" [isSubmitting]="isSaving"
            (fieldChange)="onFieldValueChange($event)" (formSubmit)="save($event)" (formCancel)="cancel()">
          </app-generic-form>
        </div>
      </div>

    </div>
  </main>
</div>

<ng-container *ngIf="isModal">
  <div class="modal-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; overflow-y: auto; padding: 20px;">
    <div class="modal-content card" style="width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; background: var(--card-bg); padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); position: relative;">
      
      <button (click)="cancel()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted);">&times;</button>
      
      <h2 style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin-top: 0; margin-bottom: 24px; font-family: 'DM Serif Display', serif;">
        {{ isEditMode ? 'Editare Gospodărie' : 'Adăugare Gospodărie' }}
      </h2>

      <div style="padding: 0; margin-top: -10px;">
        <app-generic-form [config]="formConfig" [initialData]="formInitialData" [isSubmitting]="isSaving"
          (fieldChange)="onFieldValueChange($event)" (formSubmit)="save($event)" (formCancel)="cancel()">
        </app-generic-form>
      </div>
    </div>
  </div>
</ng-container>
