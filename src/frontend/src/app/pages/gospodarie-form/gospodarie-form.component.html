<div class="app-shell">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">Registru Agricol - Gospodării</div>
      <div class="topbar-spacer"></div>
    </header>

    <div class="page-content">
      <div class="page-header-row">
        <div>
          <h1 style="font-size:22px;font-weight:700;font-family:'DM Serif Display',serif;color:var(--text-primary);margin-bottom:3px">
            {{ isEditMode ? 'Editare Gospodărie' : 'Adăugare Gospodărie Nouă' }}
          </h1>
        </div>
      </div>

      <div class="card" style="padding: 20px; max-width: 800px;">
        <form [formGroup]="gospodarieForm" (ngSubmit)="onSubmit()">
          
          <h3 style="margin-top:0">Informații Principale</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Cod Gospodărie *</label>
              <input type="text" formControlName="codGospodarie" class="form-control" />
            </div>
            
            <div class="form-group">
              <label>Tip Gospodărie *</label>
              <select formControlName="tipGospodarie" class="form-control">
                <option value="INDIVIDUALA">Individuală</option>
                <option value="COLECTIVA">Colectivă</option>
                <option value="ASOCIATIE">Asociație</option>
              </select>
            </div>

            <div class="form-group">
              <label>UAT *</label>
              <select formControlName="uat" [compareWith]="compareUat" class="form-control">
                <option [ngValue]="null">Selectați UAT...</option>
                <option *ngFor="let u of uats" [ngValue]="u">{{ u.denumire }} ({{ u.judet }})</option>
              </select>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 25px;">
              <input type="checkbox" formControlName="activa" id="activa" />
              <label for="activa" style="margin: 0;">Gospodărie Activă</label>
            </div>
          </div>

          <h3 style="margin-top:20px; border-top: 1px solid #eee; padding-top: 20px;">Adresă</h3>
          <div formGroupName="adresa" class="form-grid">
            <div class="form-group">
              <label>Județ</label>
              <input type="text" formControlName="county" class="form-control" />
            </div>
            <div class="form-group">
              <label>Localitate</label>
              <input type="text" formControlName="localitate" class="form-control" />
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>Stradă</label>
              <input type="text" formControlName="street" class="form-control" />
            </div>
            <div class="form-group">
              <label>Număr</label>
              <input type="text" formControlName="streetNumber" class="form-control" />
            </div>
            <div class="form-group">
              <label>Cod Poștal</label>
              <input type="text" formControlName="postalCode" class="form-control" />
            </div>
            <div class="form-group">
              <label>Bloc</label>
              <input type="text" formControlName="building" class="form-control" />
            </div>
            <div class="form-group">
              <label>Scară</label>
              <input type="text" formControlName="staircase" class="form-control" />
            </div>
            <div class="form-group">
              <label>Etaj</label>
              <input type="number" formControlName="floor" class="form-control" />
            </div>
            <div class="form-group">
              <label>Ap.</label>
              <input type="number" formControlName="apartmentNumber" class="form-control" />
            </div>
          </div>

          <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button type="submit" class="btn-primary" [disabled]="gospodarieForm.invalid">
              Salvează
            </button>
            <button type="button" class="btn-secondary" (click)="cancel()">
              Anulează
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
