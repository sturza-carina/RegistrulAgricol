<app-layout>
  <app-breadcrumbs [items]="breadcrumbItems" style="display: block; margin-bottom: 14px;"></app-breadcrumbs>

  <app-page-header 
    [title]="uat ? 'Detalii UAT ' + uat.denumire : 'Detalii UAT'" 
    [description]="'Vizualizați informațiile complete ale unității administrativ-teritoriale.'">
  </app-page-header>

  <div *ngIf="loadError" style="background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px">
    {{ loadError }}
  </div>

  <div style="margin-bottom: 20px;">
    <button class="btn-secondary" (click)="goBack()" style="display: flex; align-items: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Înapoi la lista tenantului
    </button>
  </div>

  <div class="card" *ngIf="uat" style="padding: 30px;">
    <div class="section-title">
      <div class="section-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      Informații Generale
    </div>
    
    <div style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div>
        <p><strong>Nume:</strong> {{ uat.denumire }}</p>
        <p><strong>Cod SIRUTA:</strong> <span style="font-family: monospace; color: var(--text-secondary);">{{ uat.codSiruta }}</span></p>
        <p><strong>Județ:</strong> {{ uat.judet }}</p>
      </div>
      <div>
        <p><strong>Tip UAT:</strong> {{ uat.tipUat }}</p>
        <p><strong>Status:</strong> 
          <span class="badge" [ngClass]="uat.isActive ? 'active' : 'archived'" style="margin-left: 8px;">
            {{ uat.isActive ? 'Activ' : 'Inactiv' }}
          </span>
        </p>
        <p *ngIf="uat.tenantId"><strong>Tenant Asignat:</strong> {{ uat.tenantId }}</p>
      </div>
    </div>
  </div>
</app-layout>
