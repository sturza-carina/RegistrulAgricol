<section class="machinery-shell">
  <div class="modal-overlay" *ngIf="showForm" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; overflow-y: auto; padding: 20px;">
    <div class="modal-content card" style="width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; background: var(--card-bg, #fff); padding: 30px; border-radius: var(--radius-lg, 12px); box-shadow: var(--shadow-xl, 0 8px 24px rgba(0,0,0,0.1)); position: relative;">
      
      <button (click)="cancelForm()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted, #6b7280);">&times;</button>
      
      <h2 style="font-size: 20px; font-weight: 700; color: var(--text-primary, #111827); margin-top: 0; margin-bottom: 24px; font-family: 'DM Serif Display', serif;">
        {{ editingId ? 'Editare utilaj' : 'Adăugare utilaj nou' }}
      </h2>

      <div style="padding: 0; margin-top: -10px;">
        <app-generic-form 
          *ngIf="showForm"
          [config]="formConfig" 
          [initialData]="formInitialData"
          (formSubmit)="saveMachinery($event)"
          (formCancel)="cancelForm()">
        </app-generic-form>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="empty-state">Se încarcă utilajele...</div>

  <app-generic-table *ngIf="!isLoading"
    [data]="machineryList"
    [columns]="columns"
    [filters]="filters"
    [actions]="actions"
    [title]="'Lista utilajelor'"
    [itemsPerPage]="6"
    [primaryActionText]="'Adăugare Utilaj'"
    (primaryAction)="openCreateForm()">
  </app-generic-table>
</section>
