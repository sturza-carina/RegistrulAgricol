<app-layout>
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  
  <app-page-header 
    title="Gestionare Persoane & Entități" 
    description="Înregistrați și gestionați persoanele fizice și juridice în registrul agricol.">
  </app-page-header>

  <!-- Banner UAT activ — apare doar pentru non-superadmin -->
  <app-active-uat-banner 
    *ngIf="activeUat && user?.role !== 'ROLE_SUPER_ADMIN'"
    [prefix]="'Persoane din:'"
    [uatName]="activeUat.denumire">
  </app-active-uat-banner>

  <div class="card" *ngIf="!persoane.length && uatContextService?.getActiveUat() == null && user?.role === 'ROLE_SUPER_ADMIN'" style="padding: 40px; text-align: center; margin-bottom: 20px;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5" style="margin-bottom: 16px;">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    <h3 style="margin-bottom: 8px;">Niciun Tenant selectat</h3>
    <p style="color: var(--text-muted); max-width: 400px; margin: 0 auto 20px;">Vă rugăm să selectați un Tenant / UAT din selectorul din stânga pentru a vizualiza sau înregistra persoanele acestuia.</p>
  </div>

  <app-generic-table
    *ngIf="!(uatContextService?.getActiveUat() == null && user?.role === 'ROLE_SUPER_ADMIN')"
    [data]="persoane"
    [columns]="columns"
    [filters]="filters"
    [actions]="actions"
    [title]="'Persoane Înregistrate'"
    [itemsPerPage]="6"
    [primaryActionText]="'Adaugă Persoană'"
    (primaryAction)="goToCreatePerson()">
  </app-generic-table>
</app-layout>
<app-persoana-form 
  *ngIf="showPersonModal" 
  [isModal]="true" 
  [editId]="editPersonId" 
  (closeForm)="closePersonModal()">
</app-persoana-form>
