<ng-container *ngIf="!isModal">
  <div class="app-shell">
    <app-sidebar></app-sidebar>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">Registru Agricol - Animale</div>
        <div class="topbar-spacer"></div>
      </header>
      <div class="page-content">
        <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
        <ng-container *ngTemplateOutlet="formContent"></ng-container>
      </div>
    </main>
  </div>
</ng-container>

<ng-container *ngIf="isModal">
  <div class="modal-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; overflow-y: auto; padding: 20px;">
    <div class="modal-content card" style="width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; background: var(--card-bg); padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); position: relative;">
      
      <button (click)="cancel()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--text-muted); transition: color 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-muted)'" title="Închide">&times;</button>
      
      <ng-container *ngTemplateOutlet="formContent"></ng-container>
    </div>
  </div>
</ng-container>

<ng-template #formContent>
  <div [ngClass]="{'page-header-row': !isModal}" [style]="!isModal ? 'max-width: 800px; margin: 0 auto 20px;' : 'margin-bottom: 24px;'">
    <div style="display: flex; align-items: center; gap: 15px;">
      <button *ngIf="!isModal" class="back-btn" (click)="cancel()" style="background:none; border:none; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:8px; border-radius:50%; transition:background 0.2s;" onmouseover="this.style.background='var(--body-bg)'" onmouseout="this.style.background='none'" title="Înapoi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h2 *ngIf="isModal" style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0; font-family: 'DM Serif Display', serif;">
        {{ isEditMode ? 'Editare Efectiv Grup' : 'Adăugare Efectiv Grup' }}
      </h2>
      <h1 *ngIf="!isModal" style="font-size:24px;font-weight:700;font-family:'DM Serif Display',serif;color:var(--text-primary);margin:0;">
        {{ isEditMode ? 'Editare Efectiv Grup' : 'Adăugare Efectiv Grup' }}
      </h1>
    </div>
    <p *ngIf="!isModal" style="font-size:13px; color:var(--text-secondary); margin-top: 4px;">
      Introduceți datele pentru efectivul de animale crescute în grup/flock/familii.
    </p>
  </div>

  <div [ngClass]="{'card': !isModal}" [style]="!isModal ? 'padding: 30px; max-width: 800px; margin: 0 auto;' : 'padding: 0;'">
    <app-generic-form 
      *ngIf="formConfig.sections.length > 0"
      [config]="formConfig" 
      [initialData]="formInitialData"
      (formSubmit)="save($event)"
      (formCancel)="cancel()">
    </app-generic-form>
  </div>
</ng-template>
