<app-layout [activeGospodarieId]="gospodarieId" [activeTab]="activeTab">
    <ng-container *ngIf="gospodarie">
      <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>

      <div class="page-header-row">
        <div style="display: flex; align-items: center; gap: 15px;">
          <button routerLink="/gospodarii" class="back-btn" style="background:none; border:none; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:8px; border-radius:50%; transition:background 0.2s;" onmouseover="this.style.background='var(--body-bg)'" onmouseout="this.style.background='none'" title="Înapoi">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <h1 style="font-size:24px;font-weight:700;font-family:'DM Serif Display',serif;color:var(--text-primary);margin:0;">
            Gospodăria #{{ gospodarie.codGospodarie }}
          </h1>
          <span class="badge" [class]="gospodarie.activa ? 'activ' : 'inactiv'" style="margin-left: 10px;">{{ gospodarie.activa ? 'Activă' : 'Inactivă' }}</span>
        </div>
        <div>
           <!-- Edit button removed as requested -->
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px; padding: 20px;" *ngIf="activeTab === 'GENERAL'">
        <app-gospodarie-form [isEmbedded]="true" [inputGospodarieId]="gospodarieId"></app-gospodarie-form>
      </div>

    <!-- TAB: MEMBRI -->
    <div *ngIf="activeTab === 'MEMBERS'" class="tab-pane fade show active">
      <div class="content-card">
        <ng-container *ngIf="!isAddingMember">
          <div class="card-header">
            <h3>Persoane / Membri Gospodărie</h3>
            <button class="btn btn-primary btn-sm" (click)="addPerson()">Adaugă Membru</button>
          </div>

          <app-generic-table
            [data]="persoane"
            [columns]="membriColumns"
            [filters]="membriFilters"
            [actions]="membriActions"
            emptyMessage="Nu există membri adăugați.">
          </app-generic-table>
        </ng-container>

        <ng-container *ngIf="isAddingMember">
          <div class="card-header">
            <h3>Selectează o Persoană existentă sau Adaugă una nouă</h3>
            <div class="d-flex gap-2">
              <button class="btn btn-secondary btn-sm" (click)="cancelAddPerson()">Înapoi la Membri</button>
              <button class="btn btn-primary btn-sm" (click)="createNewPerson()">Adaugă Persoană Nouă</button>
            </div>
          </div>

          <app-generic-table
            [data]="toatePersoanele"
            [columns]="membriColumns"
            [filters]="membriFilters"
            [actions]="toatePersoaneleActions"
            emptyMessage="Nu există alte persoane în UAT.">
          </app-generic-table>
        </ng-container>
      </div>
    </div>

      <div class="management-container" *ngIf="activeTab === 'TERENURI'" style="padding-top: 15px;">
        <app-generic-table
          [data]="terenuri"
          [columns]="terenuriColumns"
          [filters]="terenuriFilters"
          [actions]="terenuriActions"
          [title]="'Terenuri Agricole'"
          [itemsPerPage]="6"
          [primaryActionText]="'Adaugă Teren'"
          (primaryAction)="addTeren()">
        </app-generic-table>
      </div>

      <!-- Utilaje Section -->
      <div style="margin-bottom: 20px;" *ngIf="activeTab === 'MACHINERY'">
        <app-machinery-management [gospodarieId]="gospodarieId"></app-machinery-management>
      </div>

      <!-- Cladiri Section -->
      <div style="margin-bottom: 20px;" *ngIf="activeTab === 'BUILDINGS'">
        <app-cladire-management [gospodarieId]="gospodarieId"></app-cladire-management>
      </div>

      <!-- Animale Section -->
      <div style="margin-bottom: 20px;" *ngIf="activeTab === 'ANIMALS'">
        <app-animal-list [gospodarieId]="gospodarieId"></app-animal-list>
      </div>

      <!-- Documente Section-->
      <div style="margin-bottom: 20px;" *ngIf="activeTab === 'DOCUMENTS'">
        <app-document-management [gospodarieId]="gospodarieId"></app-document-management>
      </div>

    </ng-container>
</app-layout>

<app-persoana-form *ngIf="showPersonModal" [isModal]="true" [hideGospodarieSelect]="true" [gospodarieId]="gospodarieId" [editId]="editPersonId" (closeForm)="closePersonModal()"></app-persoana-form>

<app-teren-form
  *ngIf="showTerenModal"
  [isModal]="true"
  [inputGospodarieId]="gospodarieId"
  (closeForm)="closeTerenModal()">
</app-teren-form>
