<app-layout>
  <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
  
  <app-page-header 
    title="Gospodării" 
    description="Gestionați gospodăriile din Registrul Agricol. Faceți click pe o gospodărie pentru a vedea acțiunile.">
  </app-page-header>

      <!-- Banner UAT activ — apare doar pentru non-superadmin -->
      <div *ngIf="activeUat && user?.role !== 'ROLE_SUPER_ADMIN'"
           style="display:flex; align-items:center; gap:8px;
            background:var(--primary-light); color:var(--primary);
            padding:8px 14px; border-radius:8px; font-size:13px;
            margin-bottom:16px; font-weight:500; border: 1px solid var(--primary-light);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Gospodării din: <strong style="margin-left: 4px;">{{ activeUat.denumire }}</strong>
      </div>

      <!-- Action Bar when a row is selected -->
      <div class="action-bar" *ngIf="selectedGospodarie">
        <span class="selected-text">Ați selectat gospodăria: <strong>{{ selectedGospodarie.codGospodarie }}</strong></span>

        <div class="action-buttons">
          <button class="btn-secondary action-btn" (click)="viewDetailsSelected()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Detalii
          </button>

          <button class="btn-secondary action-btn" (click)="editSelected()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Editare
          </button>

          <button class="btn-secondary action-btn" (click)="addParcelaSelected()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2"/>
              <line x1="8" y1="2" x2="8" y2="18"/>
              <line x1="16" y1="6" x2="16" y2="22"/>
            </svg>
            Adaugă Parcelă
          </button>

          <button class="btn-secondary action-btn" (click)="addPersoanaSelected()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            Adaugă Persoană
          </button>

          <button class="btn-secondary action-btn delete-btn" (click)="deleteSelected()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            Șterge
          </button>
        </div>
      </div>

      <app-generic-table
        [data]="gospodarii"
        [columns]="columns"
        [filters]="filters"
        [actions]="actions"
        [title]="'Gospodării'"
        [itemsPerPage]="6"
        [primaryActionText]="'Adaugă Gospodărie'"
        (primaryAction)="goToCreate()"
        (rowClick)="selectGospodarie($event)">
      </app-generic-table>
</app-layout>
