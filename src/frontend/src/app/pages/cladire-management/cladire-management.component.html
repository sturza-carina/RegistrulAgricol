<app-generic-table 
  [data]="cladiri"
  [columns]="columns"
  [actions]="actions"
  [title]="'Clădiri și Construcții'"
  [itemsPerPage]="6"
  [primaryActionText]="'Adaugă Clădire'"
  (primaryAction)="openAddModal()">
</app-generic-table>

<!-- Modal Form -->
<div class="modal-overlay" *ngIf="showModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; overflow-y: auto; padding: 20px;">
    <div class="modal-content card" style="width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; background: var(--card-bg); padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); position: relative;">
        
        <button (click)="closeModal()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted);">&times;</button>
        
        <h2 style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin-top: 0; margin-bottom: 24px; font-family: 'DM Serif Display', serif;">
            {{ isEditing ? 'Editează Clădire' : 'Adaugă Clădire' }}
        </h2>
        
        <div style="padding: 0; margin-top: -10px;">
            <app-generic-form 
                *ngIf="showModal"
                [config]="formConfig" 
                [initialData]="formInitialData"
                (formSubmit)="saveCladire($event)"
                (formCancel)="closeModal()">
            </app-generic-form>
        </div>
    </div>
</div>
