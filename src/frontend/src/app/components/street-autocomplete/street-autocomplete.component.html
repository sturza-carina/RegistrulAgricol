<div class="street-autocomplete">
  <input
    type="text"
    class="form-control"
    [value]="value"
    [placeholder]="placeholder"
    [disabled]="disabled"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    autocomplete="off" />
  <ul class="suggestions" *ngIf="showSuggestions">
    <li *ngFor="let s of suggestions" (mousedown)="selectSuggestion(s)">{{ s }}</li>
  </ul>
</div>
