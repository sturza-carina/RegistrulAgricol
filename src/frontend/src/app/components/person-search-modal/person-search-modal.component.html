<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Căutare și Selectare Persoană</h2>
      <button class="modal-close-btn" (click)="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Search Input -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="text"
            placeholder="Caută după CNP, nume, nume firma, CUI..."
            class="search-input"
            (input)="onSearch($event)"
            [(ngModel)]="searchTerm"
          >
        </div>
      </div>

      <!-- Results List -->
      <div class="results-container">
        <div *ngIf="filteredPersons.length === 0" class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: #64748b;">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <p>Niciun rezultat găsit</p>
          <small *ngIf="searchTerm">Încearcă cu alți termeni de căutare</small>
        </div>

        <ul class="persons-list" *ngIf="filteredPersons.length > 0">
          <li *ngFor="let person of filteredPersons" class="person-item" (click)="selectPerson(person)">
            <div class="person-info">
              <div class="person-name">{{ getPersonDisplayName(person) }}</div>
              <div class="person-type">
                {{ person.personType === 'PHYSICAL_PERSON' ? 'Persoană Fizică' : 'Persoană Juridică' }}
              </div>
            </div>
            <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </li>
        </ul>
      </div>

      <div class="results-info">
        <small>Se afișează <strong>{{ filteredPersons.length }}</strong> din <strong>{{ persoane.length }}</strong> persoane</small>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="closeModal()">Anulare</button>
    </div>
  </div>
</div>
