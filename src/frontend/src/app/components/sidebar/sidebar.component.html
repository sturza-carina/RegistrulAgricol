<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="logo-title">Registru<br>Agricol</div>
    <div class="logo-subtitle">Management Platform</div>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item" routerLink="/super-admin" routerLinkActive="active" *ngIf="user?.role === 'ROLE_SUPER_ADMIN'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>
    
    <a class="nav-item" routerLink="/tenant-admin" routerLinkActive="active" *ngIf="user?.role !== 'ROLE_SUPER_ADMIN'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>

    <a class="nav-item" routerLink="/tenants/new" routerLinkActive="active" *ngIf="user?.role === 'ROLE_SUPER_ADMIN'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Tenants
    </a>
    
    <a class="nav-item" routerLink="/uats" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      UATs
    </a>

    <a class="nav-item" routerLink="/user-management" routerLinkActive="active" *ngIf="user?.role === 'ROLE_SUPER_ADMIN' || user?.role === 'ROLE_ADMIN'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Users
    </a>

    <a class="nav-item" routerLink="/persons" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Persons
    </a>
    
    <button class="nav-item" style="opacity: 0.5; cursor: not-allowed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      Reports
    </button>

    <button class="nav-item" style="opacity: 0.5; cursor: not-allowed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 1 1.79 11.26l-3.07-3.07"/>
        <path d="M4.93 4.93a10 10 0 0 0-1.79 11.26l3.07-3.07"/>
        <path d="M12 2v2m0 18v-2m10-8h-2M4 12H2"/>
      </svg>
      Settings
    </button>
  </nav>

  <div class="sidebar-bottom">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--sidebar-hover)">
      <div class="avatar" style="width:30px;height:30px;font-size:11px">{{ (user?.username?.charAt(0) || 'A') | uppercase }}</div>
      <div>
        <div style="font-size:12.5px;font-weight:600;color:var(--sidebar-text)">{{ user?.username || 'Admin User' }}</div>
        <div style="font-size:10.5px;color:var(--sidebar-muted)">{{ user?.role === 'ROLE_SUPER_ADMIN' ? 'System Administrator' : 'Registry User' }}</div>
      </div>
    </div>
    <button class="nav-item" (click)="logout()" style="margin-top:4px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </button>
  </div>
</aside>
