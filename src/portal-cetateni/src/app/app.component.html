<nav class="navbar">
  <div class="container">
    <a routerLink="/" class="navbar-brand">
      Portal Cetățeni
    </a>
    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Acasă</a></li>
      <li><a routerLink="/cereri" routerLinkActive="active" *ngIf="authService.currentUser$ | async">Depune Cerere</a></li>
      <li><a routerLink="/cereri-mele" routerLinkActive="active" *ngIf="authService.currentUser$ | async">Cererile Mele</a></li>
      <li><a routerLink="/stadiu" routerLinkActive="active" *ngIf="!(authService.currentUser$ | async)">Verifică Stadiu</a></li>
      
      <li *ngIf="!(authService.currentUser$ | async)"><a routerLink="/login" routerLinkActive="active" class="btn-login">Autentificare</a></li>
      <li *ngIf="authService.currentUser$ | async">
        <a href="javascript:void(0)" (click)="logout()" class="btn-logout">Deconectare</a>
      </li>
    </ul>
  </div>
</nav>

<router-outlet></router-outlet>

<!-- Toast Notification Container -->
<div class="toast-container" *ngIf="toastMessage">
  <div class="toast-card">
    <div class="toast-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <div class="toast-content">
      <h4>Notificare nouă</h4>
      <p>{{ toastMessage }}</p>
    </div>
    <button class="toast-close" (click)="closeToast()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
