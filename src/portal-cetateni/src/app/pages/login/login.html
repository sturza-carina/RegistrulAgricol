<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Autentificare</h2>
      <p>Bine ai venit în Portalul Cetățeanului</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="adresa@email.com">
        </div>
      </div>

      <div class="form-group">
        <label for="parola">Parolă</label>
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="parola" name="parola" [(ngModel)]="parola" required placeholder="••••••••">
        </div>
      </div>

      <div class="error-msg" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="auth-btn" [disabled]="loginForm.invalid || loading">
        <span *ngIf="!loading">Intră în cont</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="auth-footer">
        <p>Nu ai cont? <a routerLink="/register">Înregistrează-te</a></p>
      </div>
    </form>
  </div>
</div>
